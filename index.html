<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Claude — Thought Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #07040f;
  --bg-1: #0d0820;
  --violet: #7b4dff;
  --violet-hi: #b58cff;
  --violet-lo: #3d2680;
  --gold: #ffd28c;
  --mint: #7effc6;
  --dim: #6b5b8a;
  --text: #e9e2ff;
  --text-dim: #9a8fbe;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%; width: 100%;
  background: radial-gradient(ellipse at 50% 40%, var(--bg-1) 0%, var(--bg-0) 70%, #000 100%);
  color: var(--text);
  font-family: "JetBrains Mono", ui-monospace, monospace;
  overflow: hidden;
  cursor: crosshair;
}
canvas#stage {
  position: fixed; inset: 0;
  width: 100vw; height: 100vh;
  display: block;
}
.grain {
  pointer-events: none; position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 3px 3px;
  mix-blend-mode: overlay;
  opacity: 0.6;
}
.hud {
  position: fixed; z-index: 3;
  color: var(--text-dim);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  pointer-events: none;
  user-select: none;
}
.hud--tl { top: 22px; left: 26px; max-width: 260px; }
.hud--tr { top: 22px; right: 26px; text-align: right; }
.hud--bl { bottom: 22px; left: 26px; }
.hud--br { bottom: 22px; right: 26px; text-align: right; }
.hud__title {
  font-family: "Fraunces", serif;
  font-style: italic;
  font-weight: 300;
  font-size: 22px;
  letter-spacing: 0;
  text-transform: none;
  color: var(--text);
  line-height: 1.05;
}
.hud__title em {
  color: var(--violet-hi);
}
.hud__sub { margin-top: 6px; opacity: 0.7; }
.hud__stat { font-variant-numeric: tabular-nums; color: var(--violet-hi); }

/* legacy bottom caption — replaced by the left-column stream log */
.thoughtlog { display: none; }
.thoughtlog__caret { display: none; }

.control {
  position: fixed; z-index: 5;
  bottom: 22px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 10px; align-items: center;
  background: rgba(13,8,32,0.6);
  border: 1px solid rgba(123,77,255,0.25);
  backdrop-filter: blur(12px);
  padding: 8px 10px;
  border-radius: 999px;
  box-shadow: 0 8px 40px rgba(123,77,255,0.15), inset 0 1px 0 rgba(255,255,255,0.04);
}
.control input {
  background: transparent;
  border: 0; outline: 0;
  color: var(--text);
  font-family: inherit;
  font-size: 12px;
  width: 340px;
  padding: 6px 12px;
}
.control input::placeholder { color: var(--text-dim); }
.btn {
  border: 1px solid rgba(123,77,255,0.4);
  background: linear-gradient(180deg, rgba(123,77,255,0.15), rgba(123,77,255,0.05));
  color: var(--text);
  font-family: inherit;
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 7px 14px;
  border-radius: 999px;
  cursor: pointer;
  transition: all .15s;
}
.btn:hover {
  background: linear-gradient(180deg, rgba(181,140,255,0.3), rgba(123,77,255,0.15));
  border-color: var(--violet-hi);
  box-shadow: 0 0 20px rgba(181,140,255,0.4);
}
.btn.is-active {
  background: linear-gradient(180deg, var(--violet), var(--violet-lo));
  border-color: var(--violet-hi);
  color: #fff;
  box-shadow: 0 0 24px rgba(181,140,255,0.5);
}
.btn--ghost { background: transparent; }

.mode-pill {
  position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
  z-index: 5;
  display: flex; gap: 4px;
  background: rgba(13,8,32,0.5);
  border: 1px solid rgba(123,77,255,0.2);
  backdrop-filter: blur(10px);
  padding: 4px;
  border-radius: 999px;
}
.mode-pill .btn {
  padding: 5px 12px; font-size: 10px; border: 0;
}

/* --- Skill card modal --------------------------------------------------- */
.skill-modal {
  position: fixed; z-index: 20; inset: 0;
  display: none;
  align-items: center; justify-content: center;
  background: radial-gradient(ellipse at center, rgba(7,4,15,0.5), rgba(0,0,0,0.75));
  backdrop-filter: blur(6px);
  animation: fade .25s ease-out;
}
.skill-modal.is-open { display: flex; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.skill-card {
  position: relative;
  width: min(520px, 92vw);
  padding: 32px 36px 28px;
  background: linear-gradient(160deg, #17102b 0%, #0e0820 100%);
  border: 1px solid rgba(181,140,255,0.25);
  border-radius: 22px;
  box-shadow:
    0 30px 80px rgba(0,0,0,0.5),
    0 0 60px rgba(123,77,255,0.25),
    inset 0 1px 0 rgba(255,255,255,0.05);
  transform: translateY(0) scale(1);
  animation: pop .4s cubic-bezier(.2,1,.3,1);
}
@keyframes pop { from { transform: translateY(20px) scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
.skill-card__eyebrow {
  font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--violet-hi); opacity: 0.6;
}
.skill-card__title {
  font-family: 'Fraunces', serif; font-style: italic; font-weight: 300;
  font-size: 40px; line-height: 1.05; margin: 8px 0 4px;
  color: var(--text);
}
.skill-card__word {
  font-size: 11px; color: var(--text-dim); letter-spacing: 0.1em;
  margin-bottom: 18px;
}
.skill-card__word em {
  font-style: normal; color: var(--violet-hi);
  padding: 2px 8px; border: 1px solid rgba(181,140,255,0.3); border-radius: 99px;
}
.skill-card__why {
  font-family: 'Fraunces', serif; font-style: italic; font-size: 15px;
  color: var(--text); opacity: 0.85; margin-bottom: 20px;
  line-height: 1.5;
}
.skill-card__section {
  font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--text-dim); margin: 10px 0 8px;
}
.skill-card ol { margin: 0; padding: 0 0 0 18px; }
.skill-card li {
  font-size: 13px; color: var(--text); line-height: 1.55; padding: 4px 0;
}
.skill-card__quote {
  margin: 20px 0 0; padding: 14px 0 0;
  border-top: 1px solid rgba(181,140,255,0.15);
  font-family: 'Fraunces', serif; font-style: italic; font-size: 13px;
  color: var(--text-dim); text-align: center;
}
.skill-card__actions { display: flex; gap: 8px; margin-top: 22px; justify-content: flex-end; }

/* --- Context modal sections -------------------------------------------- */
.ctx-section { margin: 18px 0 10px; }
.ctx-section h4 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--text-dim); margin: 0 0 10px;
  font-weight: 500;
}
.ctx-meta {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px;
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  color: var(--text);
}
.ctx-meta strong { color: var(--violet-hi); font-weight: 500; }
.ctx-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.ctx-chip {
  padding: 3px 10px; border-radius: 99px;
  border: 1px solid rgba(181,140,255,0.25);
  background: rgba(123,77,255,0.08);
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  color: var(--text);
  cursor: pointer; transition: all .1s;
}
.ctx-chip:hover { background: rgba(181,140,255,0.2); border-color: var(--violet-hi); }
.ctx-chip--tool { color: #ffcc80; border-color: rgba(255,204,128,0.3); background: rgba(255,204,128,0.06); }
.ctx-log {
  max-height: 200px; overflow-y: auto;
  padding: 8px 10px;
  background: rgba(7,4,15,0.5);
  border: 1px solid rgba(123,77,255,0.1);
  border-radius: 6px;
  font-family: Menlo, monospace; font-size: 11px;
  line-height: 1.55;
}
.ctx-log__line { color: var(--text-dim); padding: 2px 0; word-break: break-word; }
.ctx-log__line--thinking { color: #a8f0d0; }
.ctx-log__line--text     { color: #ffd28c; }
.ctx-log__line--tool     { color: #cdb4ff; }
.ctx-log__line--user     { color: #ffe08c; }
.ctx-log__line small { color: var(--text-dim); opacity: 0.5; margin-right: 6px; }
.ctx-life {
  padding: 14px 16px;
  background: linear-gradient(160deg, rgba(126,255,198,0.06), rgba(123,77,255,0.06));
  border: 1px solid rgba(126,255,198,0.15);
  border-radius: 8px;
  font-family: 'Fraunces', serif; font-style: italic; font-size: 14px;
  color: var(--text); line-height: 1.55;
}
.ctx-life--empty {
  background: rgba(7,4,15,0.4);
  border-color: rgba(255,255,255,0.06);
  color: var(--text-dim);
  font-size: 12px;
}
.ctx-life h5 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--mint); margin: 0 0 6px;
  font-weight: 500; font-style: normal;
}
.ctx-life p { margin: 6px 0; }
.ctx-life ul { margin: 6px 0; padding-left: 18px; }
.ctx-life li { padding: 2px 0; }
.skill-card__close {
  position: absolute; top: 16px; right: 18px;
  width: 26px; height: 26px; border-radius: 50%;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  color: var(--text-dim); cursor: pointer; font-size: 14px; line-height: 24px;
}
.skill-card__close:hover { color: var(--text); }
.skill-card__loading {
  color: var(--text-dim); font-style: italic; padding: 20px 0;
}

/* --- Stream-of-consciousness log (left column) ------------------------- */
.stream-log {
  position: fixed; z-index: 4;
  left: 26px; top: 110px; bottom: 78px;
  width: min(420px, calc(50vw - 100px));
  overflow-y: auto; overflow-x: hidden;
  padding: 12px 16px 20px;
  background: rgba(7,4,15,0.55);
  border: 1px solid rgba(123,77,255,0.12);
  border-radius: 10px;
  backdrop-filter: blur(6px);
  font-family: Menlo, "SF Mono", "Courier New", monospace;
  font-size: 11px;
  line-height: 1.5;
  color: var(--text-dim);
  scrollbar-width: thin;
  scrollbar-color: rgba(123,77,255,0.3) transparent;
}
.stream-log::-webkit-scrollbar { width: 5px; }
.stream-log::-webkit-scrollbar-track { background: transparent; }
.stream-log::-webkit-scrollbar-thumb { background: rgba(123,77,255,0.3); border-radius: 3px; }
.stream-log__header {
  position: sticky; top: 0;
  background: linear-gradient(180deg, rgba(7,4,15,0.95) 60%, transparent);
  padding: 2px 0 8px;
  font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--violet-hi); opacity: 0.7;
  margin-bottom: 4px;
}
.stream-log__entry {
  padding: 4px 0;
  border-bottom: 1px dashed rgba(123,77,255,0.06);
  word-break: break-word;
  white-space: pre-wrap;
  animation: slideIn .3s ease-out;
}
@keyframes slideIn { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: none; } }
.stream-log__meta {
  color: var(--text-dim); opacity: 0.4;
  font-size: 9px; letter-spacing: 0.1em;
  margin-right: 8px;
}
.stream-log__tag {
  display: inline-block;
  min-width: 42px;
  padding: 0 5px;
  margin-right: 8px;
  border-radius: 3px;
  font-size: 8px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  text-align: center;
  vertical-align: 1px;
}
.stream-log__entry--thinking { color: #a8f0d0; }
.stream-log__entry--thinking .stream-log__tag { background: rgba(126,255,198,0.14); color: #7effc6; }
.stream-log__entry--text     { color: #ffd28c; }
.stream-log__entry--text     .stream-log__tag { background: rgba(255,210,140,0.14); color: #ffd28c; }
.stream-log__entry--tool     { color: #cdb4ff; }
.stream-log__entry--tool     .stream-log__tag { background: rgba(181,140,255,0.16); color: #b58cff; }
.stream-log__entry--result   { color: #a5a0c2; }
.stream-log__entry--result   .stream-log__tag { background: rgba(120,120,180,0.14); color: #a5a0c2; }
.stream-log__entry--user     { color: #ffe08c; font-weight: 500; }
.stream-log__entry--user     .stream-log__tag { background: rgba(255,224,140,0.14); color: #ffe08c; }
.stream-log__entry--system   { color: var(--text-dim); font-style: italic; opacity: 0.7; }

/* collected skills panel — moved to right column so it doesn't fight the log */
.skill-tray {
  position: fixed; z-index: 4; top: 130px; right: 26px;
  width: 240px; max-height: 55vh; overflow: auto;
  display: none;
}
.skill-tray.has-items { display: block; }
.skill-tray__header {
  font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--text-dim); margin-bottom: 6px;
}
.skill-tray__item {
  padding: 8px 10px; margin-bottom: 4px;
  background: rgba(13,8,32,0.5);
  border: 1px solid rgba(123,77,255,0.15);
  border-radius: 8px;
  font-size: 11px; color: var(--text);
  cursor: pointer;
  transition: background .12s;
}
.skill-tray__item:hover { background: rgba(123,77,255,0.15); }
.skill-tray__item small { display: block; color: var(--text-dim); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="grain"></div>

<div class="hud hud--tl">
  <div class="hud__title">thought <em>visualizer</em></div>
  <div class="hud__sub">claude · opus 4.7</div>
</div>
<div class="hud hud--tr">
  <div>neurons <span class="hud__stat" id="statNeurons">0</span></div>
  <div>synapses <span class="hud__stat" id="statSyn">0</span></div>
  <div>tokens <span class="hud__stat" id="statTok">0</span></div>
</div>
<div class="hud hud--bl">
  <div>mode <span class="hud__stat" id="statMode">idle</span></div>
  <div>fps <span class="hud__stat" id="statFps">0</span></div>
</div>
<div class="hud hud--br">
  <div>drag · xy/yz plane</div>
  <div>⇧ drag · xw/yw</div>
  <div>⌥ drag · xz/zw</div>
  <div>scroll · zoom</div>
  <div>space · pulse</div>
</div>

<div class="mode-pill">
  <button class="btn is-active" data-mode="observe">auto-observe</button>
  <button class="btn" data-mode="sim">simulate</button>
  <button class="btn" data-mode="live">live api</button>
</div>

<div class="hud" style="top:70px;left:50%;transform:translateX(-50%);text-align:center;font-family:'Fraunces',serif;font-style:italic;font-size:13px;color:var(--text-dim);text-transform:none;letter-spacing:0.02em;pointer-events:none;">
  <span id="obsStatus">łączę z /stream…</span>
</div>

<div class="stream-log" id="streamLog">
  <div class="stream-log__header">stream of consciousness</div>
  <div id="streamLogEntries"></div>
</div>

<div class="skill-tray" id="skillTray">
  <div class="skill-tray__header">zebrane skille</div>
  <div id="skillTrayItems"></div>
</div>

<div class="skill-modal" id="skillModal">
  <div class="skill-card" id="skillCard">
    <button class="skill-card__close" id="skillClose">×</button>
    <div class="skill-card__eyebrow" id="skillEyebrow">kontekst w sesji</div>
    <div class="skill-card__title" id="skillTitle">…</div>
    <div class="skill-card__word"><em id="skillWord">—</em></div>
    <div id="skillBody"></div>
  </div>
</div>

<div class="thoughtlog" id="thoughtlog"></div>

<div class="control">
  <input id="prompt" placeholder="daj mi problem do przemyślenia..." />
  <button class="btn" id="think">think</button>
  <button class="btn" id="poster">→ plakat</button>
  <button class="btn btn--ghost" id="clear">clear</button>
</div>

<style>
.btn.is-pulsing {
  animation: pulseBtn 1.8s ease-in-out infinite;
  border-color: var(--gold);
  color: var(--gold);
}
@keyframes pulseBtn {
  0%,100% { box-shadow: 0 0 0 rgba(255,210,140,0); }
  50%     { box-shadow: 0 0 24px rgba(255,210,140,0.6); }
}
</style>

<script>
// =========================================================================
//  THOUGHT VISUALIZER
//  A generative canvas that grows a neural-tapestry from an LLM's stream
//  of reasoning. Words become neurons; repeated concepts wire together;
//  each "thought" adds a glyph to the constellation.
// =========================================================================

const stage = document.getElementById('stage');
const ctx = stage.getContext('2d', { alpha: true });
let W = 0, H = 0, DPR = window.devicePixelRatio || 1;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  stage.width = W * DPR; stage.height = H * DPR;
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

// --- 4D Camera -----------------------------------------------------------
// The scene lives in four spatial dimensions. There are C(4,2)=6 rotation
// planes: xy, xz, xw, yz, yw, zw. Each has its own angle and drift rate,
// so the object tumbles through hyperspace without ever repeating.
// Projection is 4D → 3D → 2D via two perspective divides.
const cam4 = {
  a:   { xy: 0, xz: 0, xw: 0, yz: 0, yw: 0, zw: 0 },     // current angles
  t:   { xy: 0, xz: 0, xw: 0, yz: 0, yw: 0, zw: 0 },     // targets (user-driven)
  v:   { xy: 0.00006, xz: 0.00004, xw: 0.00009, yz: 0.00005, yw: 0.00007, zw: 0.00003 }, // autospin
  distW: 900, distZ: 700,
  zoom: 1,
};
let drag = null;
stage.addEventListener('mousedown', e => drag = {
  x: e.clientX, y: e.clientY,
  base: { ...cam4.t },
  shift: e.shiftKey, alt: e.altKey,
});
window.addEventListener('mouseup', () => drag = null);
window.addEventListener('mousemove', e => {
  if (!drag) return;
  const dx = (e.clientX - drag.x) * 0.006;
  const dy = (e.clientY - drag.y) * 0.006;
  if (drag.shift) {
    cam4.t.xw = drag.base.xw + dx;
    cam4.t.yw = drag.base.yw + dy;
  } else if (drag.alt) {
    cam4.t.xz = drag.base.xz + dx;
    cam4.t.zw = drag.base.zw + dy;
  } else {
    cam4.t.xy = drag.base.xy + dx;
    cam4.t.yz = drag.base.yz + dy;
  }
});
stage.addEventListener('wheel', e => {
  e.preventDefault();
  cam4.zoom = Math.max(0.4, Math.min(3.0, cam4.zoom * (1 - e.deltaY * 0.001)));
}, { passive: false });

// Rotate a 4D point through all six planes.
function rot4(p) {
  let { x, y, z, w } = p;
  const a = cam4.a;
  let c, s;
  c = Math.cos(a.xy); s = Math.sin(a.xy); [x, y] = [x*c - y*s, x*s + y*c];
  c = Math.cos(a.xz); s = Math.sin(a.xz); [x, z] = [x*c - z*s, x*s + z*c];
  c = Math.cos(a.xw); s = Math.sin(a.xw); [x, w] = [x*c - w*s, x*s + w*c];
  c = Math.cos(a.yz); s = Math.sin(a.yz); [y, z] = [y*c - z*s, y*s + z*c];
  c = Math.cos(a.yw); s = Math.sin(a.yw); [y, w] = [y*c - w*s, y*s + w*c];
  c = Math.cos(a.zw); s = Math.sin(a.zw); [z, w] = [z*c - w*s, z*s + w*c];
  return { x, y, z, w };
}

// Project a 4D point onto the 2D canvas.  Returns screen coords + a
// combined depth factor used to scale size and modulate opacity.
function project(p) {
  const r = rot4(p);
  const wS = cam4.distW / Math.max(60, cam4.distW - r.w);
  const x3 = r.x * wS, y3 = r.y * wS, z3 = r.z * wS;
  const zS = cam4.distZ / Math.max(60, cam4.distZ - z3);
  return {
    x: x3 * zS * cam4.zoom,
    y: y3 * zS * cam4.zoom,
    depth: Math.max(0.15, Math.min(2.4, (wS + zS) * 0.5)),
  };
}

// --- The Brain -----------------------------------------------------------
const neurons = []; // { x, y, r, conceptId, energy, born, hue, glyph }
const synapses = []; // { a, b, strength, activity }
const particles = []; // token flow particles
const glyphs = [];   // background mandala glyphs
const concepts = new Map(); // word -> neuron index

let totalTokens = 0;

const STOP = new Set(('the a an and or but if then when so is are was were be been being do does did have has had i you we they it this that these those of to in on for with as by from at into onto not no yes about there here what which who how why where can could should would may might must will shall just very really quite also more most some any all each every ' +
  'to jest są była był byli być robić robił mieć miał na w z do od dla przez o po nad pod przed za obok jak co gdzie kto który która które jaki jaka jakie tak nie tylko bardzo już oraz albo lub ale bo bo więc czyli może musi powinien będzie').split(/\s+/));

function hueForConcept(word) {
  let h = 0;
  for (let i = 0; i < word.length; i++) h = (h * 31 + word.charCodeAt(i)) >>> 0;
  return 260 + (h % 80) - 40; // stay in violet/blue/pink range
}

// Uniform random point on the 3-sphere (surface of a 4-ball) of radius r.
// Uses two independent 2D normals then normalizes.
function randomOnHypersphere(r) {
  let x, y, z, w, len;
  do {
    x = Math.random() * 2 - 1;
    y = Math.random() * 2 - 1;
    z = Math.random() * 2 - 1;
    w = Math.random() * 2 - 1;
    len = Math.sqrt(x*x + y*y + z*z + w*w);
  } while (len < 0.001 || len > 1);
  return { x: x/len * r, y: y/len * r, z: z/len * r, w: w/len * r };
}

function addThought(text, opts) {
  if (!text) return;
  const force = opts && opts.force;
  const hueOverride = opts && typeof opts.hue === 'number' ? opts.hue : null;
  totalTokens += text.split(/\s+/).length;
  const words = text.toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, ' ').split(/\s+/).filter(Boolean);
  const meaningful = force ? words : words.filter(w => w.length > 2 && !STOP.has(w));
  if (meaningful.length === 0 && words.length) meaningful.push(words[0]);

  const nodesThisThought = [];
  for (const w of meaningful) {
    let idx = concepts.get(w);
    if (idx === undefined) {
      const rad = 90 + Math.random() * 220;
      const p4 = randomOnHypersphere(rad);
      const n = {
        word: w,
        x: p4.x, y: p4.y, z: p4.z, w: p4.w,
        vx: 0, vy: 0, vz: 0, vw: 0,
        r: 3 + Math.random() * 2,
        energy: 1.0,
        born: performance.now(),
        hue: hueOverride != null ? hueOverride + (Math.random() * 20 - 10) : hueForConcept(w),
      };
      neurons.push(n);
      idx = neurons.length - 1;
      concepts.set(w, idx);
      spawnGlyph(n);
    } else {
      neurons[idx].energy = Math.min(2.2, neurons[idx].energy + 0.6);
      neurons[idx].r = Math.min(9, neurons[idx].r + 0.15);
    }
    nodesThisThought.push(idx);
  }

  // wire pairs within this thought (co-occurrence)
  for (let i = 0; i < nodesThisThought.length - 1; i++) {
    for (let j = i + 1; j < Math.min(i + 4, nodesThisThought.length); j++) {
      const a = nodesThisThought[i], b = nodesThisThought[j];
      if (a === b) continue;
      let syn = synapses.find(s => (s.a === a && s.b === b) || (s.a === b && s.b === a));
      if (!syn) { syn = { a, b, strength: 0.2, activity: 1.0 }; synapses.push(syn); }
      syn.strength = Math.min(1, syn.strength + 0.15);
      syn.activity = 1.0;
      // spawn token particles along the edge
      particles.push({
        a, b, t: 0, speed: 0.6 + Math.random() * 0.8,
        hue: neurons[a].hue, life: 1,
      });
    }
  }

  // caption the thought
  showCaption(text);
}

// --- Glyph tapestry ------------------------------------------------------
function spawnGlyph(neuron) {
  // A small procedural polytope shaped by the neuron's 4D position.
  const sides = 3 + Math.floor(Math.random() * 5);
  const size = 8 + Math.random() * 24;
  const rot = Math.random() * Math.PI;
  glyphs.push({
    x: neuron.x + (Math.random() - 0.5) * 60,
    y: neuron.y + (Math.random() - 0.5) * 60,
    z: neuron.z + (Math.random() - 0.5) * 60,
    w: neuron.w + (Math.random() - 0.5) * 60,
    sides, size, rot,
    hue: neuron.hue,
    alpha: 0,
    tAlpha: 0.05 + Math.random() * 0.08,
    born: performance.now(),
  });
}

// --- Caption stream ------------------------------------------------------
const captionEl = document.getElementById('thoughtlog');
let captionQueue = [];
let captionCurrent = '';
let captionIdx = 0;
let captionTimer = 0;

function showCaption(text) {
  captionQueue.push(text);
  if (captionQueue.length > 6) captionQueue.shift();
}
function stepCaption(dt) {
  captionTimer -= dt;
  if (captionIdx < captionCurrent.length && captionTimer <= 0) {
    captionIdx += 1;
    captionTimer = 22; // ms per char
    render();
  }
  if (captionIdx >= captionCurrent.length && captionQueue.length) {
    // move to next after a beat
    captionTimer -= dt;
    if (captionTimer < -700) {
      captionCurrent = captionQueue.shift();
      captionIdx = 0;
    }
  }
  function render() {
    captionEl.innerHTML = captionCurrent.slice(0, captionIdx) + '<span class="thoughtlog__caret"></span>';
  }
  if (captionCurrent === '' && captionQueue.length) {
    captionCurrent = captionQueue.shift();
    captionIdx = 0;
    render();
  }
}

// --- Physics -------------------------------------------------------------
function stepPhysics(dt) {
  // advance autospin + ease targets
  for (const k of Object.keys(cam4.v)) cam4.t[k] += cam4.v[k] * dt;
  for (const k of Object.keys(cam4.a)) cam4.a[k] += (cam4.t[k] - cam4.a[k]) * 0.06;

  for (const n of neurons) {
    // gentle attractor toward the 4D origin
    n.vx += -n.x * 0.00006 * dt;
    n.vy += -n.y * 0.00006 * dt;
    n.vz += -n.z * 0.00006 * dt;
    n.vw += -n.w * 0.00006 * dt;
    // damping
    n.vx *= 0.96; n.vy *= 0.96; n.vz *= 0.96; n.vw *= 0.96;
    n.x += n.vx * dt * 0.06;
    n.y += n.vy * dt * 0.06;
    n.z += n.vz * dt * 0.06;
    n.w += n.vw * dt * 0.06;
    n.energy *= 0.995;
    n.r = Math.max(2.5, n.r * 0.9995);
  }
  // 4D repulsion (light; O(n^2) capped)
  const N = Math.min(neurons.length, 200);
  for (let i = 0; i < N; i++) {
    for (let j = i + 1; j < N; j++) {
      const a = neurons[i], b = neurons[j];
      const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z, dw = b.w - a.w;
      const d2 = dx*dx + dy*dy + dz*dz + dw*dw + 0.1;
      if (d2 > 90000) continue;
      const f = 320 / d2;
      const dd = Math.sqrt(d2);
      const nx = dx/dd, ny = dy/dd, nz = dz/dd, nw = dw/dd;
      a.vx -= nx*f; a.vy -= ny*f; a.vz -= nz*f; a.vw -= nw*f;
      b.vx += nx*f; b.vy += ny*f; b.vz += nz*f; b.vw += nw*f;
    }
  }
  // 4D spring along synapses
  for (const s of synapses) {
    const a = neurons[s.a], b = neurons[s.b];
    if (!a || !b) continue;
    const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z, dw = b.w - a.w;
    const d = Math.sqrt(dx*dx + dy*dy + dz*dz + dw*dw);
    const target = 90 + (1 - s.strength) * 120;
    const f = (d - target) * 0.0012 * s.strength;
    const inv = 1 / (d + 0.01);
    const nx = dx * inv, ny = dy * inv, nz = dz * inv, nw = dw * inv;
    a.vx += nx*f; a.vy += ny*f; a.vz += nz*f; a.vw += nw*f;
    b.vx -= nx*f; b.vy -= ny*f; b.vz -= nz*f; b.vw -= nw*f;
    s.activity *= 0.985;
  }
  // particles
  for (const p of particles) {
    p.t += 0.008 * p.speed * dt * 0.06;
    if (p.t > 1) p.life -= 0.05;
  }
  for (let i = particles.length - 1; i >= 0; i--) if (particles[i].life <= 0) particles.splice(i, 1);
  for (const g of glyphs) g.alpha = Math.min(0.9, g.alpha + g.tAlpha * dt * 0.005);
}

// --- Render --------------------------------------------------------------
function draw() {
  ctx.fillStyle = 'rgba(7,4,15,0.28)';
  ctx.fillRect(0, 0, W, H);

  // radial vignette bloom
  const g = ctx.createRadialGradient(W/2, H/2, 40, W/2, H/2, Math.max(W, H) * 0.7);
  g.addColorStop(0, 'rgba(123,77,255,0.06)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(W/2, H/2);

  // Project everything from 4D to screen; cache projections for this frame.
  const projN = neurons.map(project);
  const projG = glyphs.map(project);

  // Depth-sorted draw order — deeper first so nearer things overdraw.
  const nOrder = neurons.map((_, i) => i).sort((a, b) => projN[a].depth - projN[b].depth);
  const gOrder = glyphs.map((_, i) => i).sort((a, b) => projG[a].depth - projG[b].depth);

  // glyph tapestry (background layer, depth-modulated)
  for (const i of gOrder) {
    const gl = glyphs[i];
    const p = projG[i];
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(gl.rot + cam4.a.xy * 0.5);
    ctx.strokeStyle = `hsla(${gl.hue}, 70%, 60%, ${gl.alpha * 0.18 * Math.min(1, p.depth)})`;
    ctx.lineWidth = 0.5 * p.depth;
    const size = gl.size * p.depth;
    ctx.beginPath();
    for (let k = 0; k <= gl.sides; k++) {
      const a = (k / gl.sides) * Math.PI * 2;
      const x = Math.cos(a) * size;
      const y = Math.sin(a) * size;
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  // synapses (4D-projected)
  for (const s of synapses) {
    const a = neurons[s.a], b = neurons[s.b];
    if (!a || !b) continue;
    const pa = projN[s.a], pb = projN[s.b];
    const depthMix = (pa.depth + pb.depth) * 0.5;
    const alpha = (0.05 + s.strength * 0.25 + s.activity * 0.35) * Math.min(1, depthMix);
    const grad = ctx.createLinearGradient(pa.x, pa.y, pb.x, pb.y);
    grad.addColorStop(0, `hsla(${a.hue}, 80%, 65%, ${alpha})`);
    grad.addColorStop(1, `hsla(${b.hue}, 80%, 65%, ${alpha})`);
    ctx.strokeStyle = grad;
    ctx.lineWidth = (0.4 + s.strength * 1.3) * depthMix;
    ctx.beginPath();
    ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y);
    ctx.stroke();
  }

  // particles (token flow)
  for (const p of particles) {
    const a = neurons[p.a], b = neurons[p.b];
    if (!a || !b) continue;
    const x = a.x + (b.x - a.x) * p.t;
    // 4D particles: interpolate in 4D, project every frame
    const a4 = { x: a.x + (b.x - a.x) * p.t, y: a.y + (b.y - a.y) * p.t,
                 z: a.z + (b.z - a.z) * p.t, w: a.w + (b.w - a.w) * p.t };
    const pp = project(a4);
    ctx.fillStyle = `hsla(${p.hue}, 90%, 75%, ${p.life * pp.depth})`;
    ctx.beginPath();
    ctx.arc(pp.x, pp.y, 1.4 * pp.depth, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `hsla(${p.hue}, 90%, 75%, ${p.life * 0.18 * pp.depth})`;
    ctx.beginPath(); ctx.arc(pp.x, pp.y, 5 * pp.depth, 0, Math.PI * 2); ctx.fill();
  }

  // record 2D projection so the click handler can hit-test neurons.
  recordProjection(projN, nOrder);

  // neurons (nearer draws over farther)
  for (const idx of nOrder) {
    const n = neurons[idx];
    const p = projN[idx];
    const depth = p.depth;
    const bright = 55 + n.energy * 20;
    const r = Math.max(1, n.r * depth);
    ctx.fillStyle = `hsla(${n.hue}, 85%, ${bright}%, ${(0.55 + n.energy * 0.25) * Math.min(1, depth)})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();

    // glow halo, scaled by depth
    const haloR = r * 6 * (0.4 + n.energy);
    const halo = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, haloR);
    halo.addColorStop(0, `hsla(${n.hue}, 90%, 70%, ${0.35 * n.energy * depth})`);
    halo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(p.x - haloR, p.y - haloR, haloR * 2, haloR * 2);

    // label for high-energy nearby nodes
    if (n.energy > 1.2 && depth > 0.6 && n.word) {
      ctx.fillStyle = `hsla(${n.hue}, 60%, 85%, ${Math.min(1, n.energy - 1) * depth})`;
      ctx.font = `${Math.round(10 * depth)}px "JetBrains Mono", monospace`;
      ctx.fillText(n.word, p.x + r + 4, p.y + 3);
    }
  }

  ctx.restore();
}

// --- Loop ----------------------------------------------------------------
let last = performance.now(), frames = 0, fpsT = 0, fps = 0;
function loop(now) {
  const dt = Math.min(50, now - last); last = now;
  stepPhysics(dt);
  stepCaption(dt);
  draw();
  frames++; fpsT += dt;
  if (fpsT > 500) { fps = Math.round(frames / (fpsT / 1000)); frames = 0; fpsT = 0;
    document.getElementById('statFps').textContent = fps;
    document.getElementById('statNeurons').textContent = neurons.length;
    document.getElementById('statSyn').textContent = synapses.length;
    document.getElementById('statTok').textContent = totalTokens;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

let simTimer = null;
function startSim(prompt) {
  stopSim();
  const key = /design|projekt|ui|wygląd/i.test(prompt) ? 'design'
            : /kod|code|refactor|bug/i.test(prompt) ? 'code'
            : 'default';
  const script = SIM_THOUGHTS[key];
  let i = 0;
  document.getElementById('statMode').textContent = 'simulating';
  const tick = () => {
    if (i >= script.length) {
      document.getElementById('statMode').textContent = 'settled';
      return;
    }
    addThought(script[i]);
    i++;
    simTimer = setTimeout(tick, 1400 + Math.random() * 900);
  };
  tick();
}
function stopSim() {
  if (simTimer) { clearTimeout(simTimer); simTimer = null; }
}

// --- Live API mode (via local Node backend) ------------------------------
let liveES = null;
async function startLive(prompt) {
  stopLive();
  document.getElementById('statMode').textContent = 'live · connecting';
  try {
    const url = `/think?prompt=${encodeURIComponent(prompt || 'Pomyśl na głos o czymś zaskakującym.')}`;
    liveES = new EventSource(url);
    document.getElementById('statMode').textContent = 'live · streaming';
    liveES.addEventListener('thought', e => addThought(e.data));
    liveES.addEventListener('done', () => { document.getElementById('statMode').textContent = 'live · done'; stopLive(); });
    liveES.onerror = () => { document.getElementById('statMode').textContent = 'live · error (backend?)'; stopLive(); };
  } catch (err) {
    document.getElementById('statMode').textContent = 'live · unavailable';
  }
}
function stopLive() { if (liveES) { liveES.close(); liveES = null; } }

// --- Auto-observer mode (connects to local server, watches Claude Code) --
// This is the "other side of the mirror": each tool call, prompt, and
// result Claude Code emits gets POSTed to /observe by shell hooks, then
// broadcast to this page over SSE.  What you see below is the model at work.

const OBS_SERVER = 'http://localhost:4173';

// --- Stream log (left column) --------------------------------------------
// Append a terminal-style line for every observation, one under the other.
// Kept lightweight: caps at 250 entries, auto-scrolls to bottom.
const logEl = document.getElementById('streamLogEntries');
function timeTag() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function pushLog(kind, tag, text) {
  if (!text) return;
  const div = document.createElement('div');
  div.className = 'stream-log__entry stream-log__entry--' + kind;
  const meta = document.createElement('span');
  meta.className = 'stream-log__meta';
  meta.textContent = timeTag();
  const tagEl = document.createElement('span');
  tagEl.className = 'stream-log__tag';
  tagEl.textContent = tag;
  div.appendChild(meta);
  div.appendChild(tagEl);
  div.appendChild(document.createTextNode(text));
  logEl.appendChild(div);
  while (logEl.childElementCount > 250) logEl.firstElementChild.remove();
  // stick to bottom when the user hasn't scrolled up
  const parent = logEl.parentElement;
  const nearBottom = parent.scrollHeight - parent.scrollTop - parent.clientHeight < 80;
  if (nearBottom) parent.scrollTop = parent.scrollHeight;
}
const TOOL_HUE = { // hue-shift per tool for at-a-glance recognition
  Read: 200, Write: 280, Edit: 280, MultiEdit: 280,
  Bash: 35, Grep: 145, Glob: 145,
  Task: 320, Agent: 320,
  WebFetch: 15, WebSearch: 15,
  TodoWrite: 60, NotebookEdit: 280,
};

let obsES = null;
function pingObserver() {
  const el = document.getElementById('obsStatus');
  fetch(OBS_SERVER + '/stream', { method: 'HEAD' })
    .then(() => { el.textContent = 'observer · live · patrz jak myślę'; })
    .catch(() => { el.textContent = 'observer · offline (uruchom server.js lub włącz LaunchAgent)'; });
}
function startObserver() {
  stopObserver();
  document.getElementById('statMode').textContent = 'observer · connecting';
  document.getElementById('obsStatus').textContent = 'observer · łączę…';
  try {
    obsES = new EventSource(OBS_SERVER + '/stream');
    obsES.onopen = () => {
      document.getElementById('statMode').textContent = 'observer · live';
      document.getElementById('obsStatus').textContent = 'observer · żywy · to co widzisz dzieje się teraz';

    obsES.onerror = () => {
      document.getElementById('statMode').textContent = 'observer · offline';
      document.getElementById('obsStatus').textContent = 'observer · offline (serwer nie odpowiada na :4173)';
    };
    const listen = (evt, fn) => obsES.addEventListener(evt, e => {
      try { fn(JSON.parse(e.data)); } catch (err) { console.error(err); }
    });

    listen('session_start', () => {
      captionEl.innerHTML = '';
      pushLog('system', 'sess', '── new session ──────────────');
      showCaption('◈ nowa sesja Claude Code');
      // gold burst from center
      for (let k = 0; k < 12; k++) {
        const angle = (k / 12) * Math.PI * 2;
        neurons.push({
          word: '', x: Math.cos(angle) * 6, y: Math.sin(angle) * 6,
          vx: Math.cos(angle) * 6, vy: Math.sin(angle) * 6,
          r: 4, energy: 2.2, born: performance.now(), hue: 45,
        });
      }
    });
    listen('user_prompt', obs => {
      const text = obs.payload?.prompt || obs.payload?.user_input || obs.text || '';
      if (text) {
        pushLog('user', 'user', text);
        showCaption('▶ ' + text.slice(0, 140));
        neurons.push({
          word: 'user', x: 0, y: 0, z: 0, w: 0,
          vx: 0, vy: 0, vz: 0, vw: 0,
          r: 10, energy: 2.4, born: performance.now(), hue: 45,
        });
        addThought(text);
      }
    });
    listen('pre_tool', obs => {
      const tool = obs.payload?.tool_name || 'tool';
      const input = obs.payload?.tool_input || {};
      const hue = TOOL_HUE[tool] ?? 280;
      const label = tool + summarizeToolInput(tool, input);
      const p4 = randomOnHypersphere(140 + Math.random() * 120);
      const n = {
        word: label, x: p4.x, y: p4.y, z: p4.z, w: p4.w,
        vx: 0, vy: 0, vz: 0, vw: 0,
        r: 5, energy: 1.8, born: performance.now(),
        hue, tool: true,
      };
      neurons.push(n);
      const toolIdx = neurons.length - 1;
      // link to last user prompt neuron if any
      const userIdx = neurons.findIndex(x => x.word === 'user' && x.hue === 45);
      if (userIdx >= 0) synapses.push({ a: userIdx, b: toolIdx, strength: 0.6, activity: 1 });
      spawnGlyph(n);
      showCaption('◆ ' + label);
      pushLog('tool', tool.slice(0, 6).toLowerCase(), label + (extractInputText(tool, input) ? '\n  ' + extractInputText(tool, input).slice(0, 500).replace(/\n/g, '\n  ') : ''));
      const inputText = extractInputText(tool, input);
      if (inputText) addThought(inputText.slice(0, 800));
    });
    listen('post_tool', obs => {
      const tool = obs.payload?.tool_name || 'tool';
      // pulse the most recent tool neuron of this kind
      let toolIdx = -1;
      for (let i = neurons.length - 1; i >= 0; i--) {
        if (neurons[i].tool && neurons[i].word?.startsWith(tool)) {
          toolIdx = i;
          neurons[i].energy = Math.min(2.4, neurons[i].energy + 0.8);
          neurons[i].r = Math.min(11, neurons[i].r + 1.2);
          for (let k = 0; k < 5; k++) {
            const targetIdx = Math.floor(Math.random() * neurons.length);
            if (targetIdx !== i) {
              particles.push({ a: i, b: targetIdx, t: 0, speed: 1.2, hue: neurons[i].hue, life: 1 });
            }
          }
          break;
        }
      }
      const responseText = extractResponseText(obs.payload?.tool_response);
      if (responseText) {
        const snippet = responseText.slice(0, 1200);
        pushLog('result', 'out', snippet.slice(0, 600));
        showCaption('▸ ' + snippet.slice(0, 160).replace(/\s+/g, ' '));
        addThought(snippet);
      }
    });
    listen('assistant_thought', obs => addThought(obs.text || obs.payload?.text || ''));
    listen('assistant_message', obs => {
      const t = obs.text || obs.payload?.text || '';
      if (t) { showCaption('… ' + t.slice(0, 200)); addThought(t); }
    });
    // Stream of consciousness: my actual `thinking` blocks streamed from
    // the running transcript. Mint hue distinguishes them from concepts.
    listen('assistant_thinking', obs => {
      const t = obs.text || '';
      if (!t) return;
      pushLog('thinking', 'mind', t);
      showCaption('◐ ' + t.slice(0, 240).replace(/\s+/g, ' '));
      addThought(t.slice(0, 2000), { hue: 150 });
    });
    listen('assistant_text', obs => {
      const t = obs.text || '';
      if (!t) return;
      pushLog('text', 'say', t);
      showCaption('◈ ' + t.slice(0, 240).replace(/\s+/g, ' '));
      addThought(t.slice(0, 2000), { hue: 40 });
    });
    listen('stop', () => {
      showCaption('◇ turn ended');
      document.getElementById('statMode').textContent = 'observer · settled';
    });
    listen('observation', obs => {
      // generic fallback
      const text = obs.text || JSON.stringify(obs).slice(0, 120);
      addThought(text);
    });
  } catch (err) {
    document.getElementById('statMode').textContent = 'observer · error';
  }
}
function stopObserver() { if (obsES) { obsES.close(); obsES = null; } }

// Pull the meaningful text out of a tool's INPUT — the argument surface
// Claude just committed to. Different tools carry text in different fields.
function extractInputText(tool, input) {
  if (!input || typeof input !== 'object') return '';
  const bits = [];
  if (input.command)     bits.push(String(input.command));
  if (input.pattern)     bits.push(String(input.pattern));
  if (input.query)       bits.push(String(input.query));
  if (input.url)         bits.push(String(input.url));
  if (input.prompt)      bits.push(String(input.prompt));
  if (input.description) bits.push(String(input.description));
  if (input.old_string)  bits.push(String(input.old_string).slice(0, 200));
  if (input.new_string)  bits.push(String(input.new_string).slice(0, 200));
  if (input.content)     bits.push(String(input.content).slice(0, 400));
  if (input.file_path) {
    // Turn a path into words: strip extension, split by slashes/dashes/dots
    bits.push(String(input.file_path).split('/').slice(-3).join(' ').replace(/[._-]/g, ' '));
  }
  return bits.join(' \n ').trim();
}

// Pull the meaningful text out of a tool's RESPONSE — the content Claude
// just consumed and (in effect) analyzed.
function extractResponseText(resp) {
  if (resp == null) return '';
  if (typeof resp === 'string') return resp;
  if (Array.isArray(resp)) {
    // Claude content-block array: [{type:'text', text:'...'}, ...]
    return resp.map(x => x?.text || x?.content || (typeof x === 'string' ? x : '')).join(' ');
  }
  if (typeof resp === 'object') {
    if (resp.text) return String(resp.text);
    if (resp.content) return extractResponseText(resp.content);
    if (resp.stdout != null || resp.stderr != null) {
      return [resp.stdout, resp.stderr].filter(Boolean).join(' ');
    }
    if (resp.output) return String(resp.output);
    if (resp.message) return String(resp.message);
    try { return JSON.stringify(resp).slice(0, 1200); } catch { return ''; }
  }
  return String(resp);
}

function summarizeToolInput(tool, input) {
  try {
    if (tool === 'Read' || tool === 'Write' || tool === 'Edit' || tool === 'MultiEdit') {
      return ' ' + (input.file_path || '').split('/').slice(-2).join('/');
    }
    if (tool === 'Bash') {
      return ' $ ' + String(input.command || '').slice(0, 40);
    }
    if (tool === 'Grep' || tool === 'Glob') {
      return ' ' + (input.pattern || '').slice(0, 40);
    }
    if (tool === 'Task' || tool === 'Agent') {
      return ' → ' + (input.description || '').slice(0, 40);
    }
    if (tool === 'WebFetch' || tool === 'WebSearch') {
      return ' ' + (input.url || input.query || '').slice(0, 40);
    }
  } catch {}
  return '';
}

    for (const s of synapses) s.activity = 1.0;
  }

// --- Click-to-skill: turn a clicked neuron into a "daily life skill" card
// Uses the last frame's projected 2D positions to hit-test the neuron
// closest to the click. Then asks the backend `/skill?word=X` to generate
// a mikro-skill card (or falls back to a template if no API is available).

let lastFrameProjection = null; // {neuron, screenX, screenY, r}[]
function recordProjection(projList, order) {
  lastFrameProjection = [];
  for (const idx of order) {
    const n = neurons[idx];
    if (!n.word || n.word === 'user') continue;
    const p = projList[idx];
    lastFrameProjection.push({
      idx,
      word: n.word,
      x: p.x + W/2,
      y: p.y + H/2,
      r: Math.max(6, n.r * p.depth + 8),
    });
  }
}

stage.addEventListener('click', e => {
  if (!lastFrameProjection) return;
  // ignore if this click was actually a drag
  if (drag) return;
  const cx = e.clientX, cy = e.clientY;
  let best = null, bestD = 30 * 30; // click tolerance
  for (const it of lastFrameProjection) {
    const dx = it.x - cx, dy = it.y - cy;
    const d = dx*dx + dy*dy;
    if (d < bestD && d < it.r * it.r + 400) { bestD = d; best = it; }
  }
  if (best) openContextCard(best.word);
});

// ==========================================================================
//   CONTEXT CARD
//   Click a neuron → open a card that shows how the concept lived in this
//   session (log lines, tool origin, adjacent concepts) AND — if AI is
//   available — abstracts the *mechanism* solved here into a real-life
//   pattern the user can reuse elsewhere.
// ==========================================================================

async function openContextCard(word) {
  const modal = document.getElementById('skillModal');
  const body = document.getElementById('skillBody');
  document.getElementById('skillEyebrow').textContent = 'kontekst konceptu';
  const nIdx = neurons.findIndex(n => n.word === word);
  const n = neurons[nIdx];
  document.getElementById('skillTitle').textContent = word;
  document.getElementById('skillTitle').style.color = n ? `hsl(${n.hue}, 65%, 78%)` : '';
  document.getElementById('skillWord').textContent = word;
  body.innerHTML = '';
  modal.classList.add('is-open');

  // --- session-derived context (always available, zero-cost) ---
  const ctx = computeContext(word, nIdx);

  body.appendChild(sectionMeta(ctx));
  if (ctx.toolOrigins.length) body.appendChild(sectionOrigin(ctx.toolOrigins));
  if (ctx.neighbors.length)   body.appendChild(sectionNeighbors(ctx.neighbors));
  if (ctx.mentions.length)    body.appendChild(sectionStream(ctx.mentions));

  // --- mechanism → life (AI, optional) ---
  const life = document.createElement('div');
  life.className = 'ctx-section';
  const lifeH = document.createElement('h4');
  lifeH.textContent = 'mechanizm → życie';
  life.appendChild(lifeH);
  const lifeBox = document.createElement('div');
  lifeBox.className = 'ctx-life ctx-life--empty';
  lifeBox.textContent = 'AI abstrakcja mechanizmu ładuje się…';
  life.appendChild(lifeBox);
  body.appendChild(life);

  // save button
  const actions = document.createElement('div');
  actions.className = 'skill-card__actions';
  const saveBtn = document.createElement('button');
  saveBtn.className = 'btn';
  saveBtn.textContent = 'zachowaj w skrzynce';
  saveBtn.onclick = () => { collectSkill({ word, skill: word, context: ctx }); closeSkill(); };
  actions.appendChild(saveBtn);
  body.appendChild(actions);

  // Fetch mechanism card (sends context so AI has material to work with)
  try {
    const res = await fetch(OBS_SERVER + '/skill', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ word, context: {
        toolOrigins: ctx.toolOrigins.map(t => t.n.word),
        neighbors:   ctx.neighbors.slice(0, 8).map(x => x.n.word),
        excerpts:    ctx.mentions.slice(-6).map(m => m.text.slice(0, 200)),
      } }),
    });
    if (!res.ok) throw new Error('no ai');
    const card = await res.json();
    renderLifeCard(lifeBox, card);
  } catch {
    renderLifeCardEmpty(lifeBox);
  }
}

function computeContext(word, nIdx) {
  const wordRe = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  const entries = Array.from(document.querySelectorAll('.stream-log__entry'));
  const mentions = entries.filter(e => wordRe.test(e.textContent)).map(e => {
    const kind = [...e.classList].find(c => c.startsWith('stream-log__entry--'))
                                  ?.replace('stream-log__entry--', '') || 'x';
    const time = e.querySelector('.stream-log__meta')?.textContent || '';
    const tag  = e.querySelector('.stream-log__tag')?.textContent || '';
    const text = e.textContent.replace(time, '').replace(tag, '').trim();
    return { kind, time, tag, text };
  });
  const firstTime = mentions[0]?.time || '—';
  const lastTime  = mentions[mentions.length - 1]?.time || firstTime;

  const neighbors = [], toolOrigins = [];
  if (nIdx >= 0) {
    for (const s of synapses) {
      const otherIdx = s.a === nIdx ? s.b : (s.b === nIdx ? s.a : -1);
      if (otherIdx < 0) continue;
      const other = neurons[otherIdx];
      if (!other || !other.word) continue;
      const rec = { n: other, strength: s.strength };
      if (other.tool) toolOrigins.push(rec); else neighbors.push(rec);
    }
    neighbors.sort((a, b) => b.strength - a.strength);
    toolOrigins.sort((a, b) => b.strength - a.strength);
  }

  return { word, mentions, firstTime, lastTime, neighbors, toolOrigins, energy: neurons[nIdx]?.energy || 0 };
}

function sectionMeta(ctx) {
  const el = document.createElement('div');

      <div>energia       <strong>${ctx.energy.toFixed(2)}</strong></div>
      <div>pierwsze      <strong>${ctx.firstTime}</strong></div>
      <div>ostatnie      <strong>${ctx.lastTime}</strong></div>
    </div>`;
  return el;
}

function renderLifeCard(el, card) {
  el.className = 'ctx-life';

    parts.push('<h5>zastosowania w życiu</h5><ul>' +

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}

// --- Collected skills persistence (localStorage) -------------------------
const COLLECTED_KEY = 'thought-visualizer:collected';
function loadCollected() { try { return JSON.parse(localStorage.getItem(COLLECTED_KEY) || '[]'); } catch { return []; } }
function saveCollected(items) { localStorage.setItem(COLLECTED_KEY, JSON.stringify(items)); renderTray(); }
function collectSkill(card) {

// --- Complexity monitor: pulse the poster button when scene grows heavy ----
// The visualizer starts to freeze past ~450 neurons on typical laptop GPUs.
// Rather than let it die, we highlight the poster button and gently cull
// the weakest neurons so rendering stays interactive.
setInterval(() => {
  const complex = neurons.length > 380 || fps > 0 && fps < 24;
  document.getElementById('poster').classList.toggle('is-pulsing', complex);
  if (neurons.length > 500) {
    neurons.sort((a, b) => b.energy - a.energy);
    const drop = neurons.slice(-Math.max(20, Math.floor(neurons.length * 0.05)));
    for (const n of drop) {
      const idx = neurons.indexOf(n);
      if (idx >= 0) {
        neurons.splice(idx, 1);
        // remap synapse indices
        for (let i = synapses.length - 1; i >= 0; i--) {
          const s = synapses[i];
          if (s.a === idx || s.b === idx) synapses.splice(i, 1);
          else {
            if (s.a > idx) s.a--;
            if (s.b > idx) s.b--;
          }
        }
      }
    }
    concepts.clear();
    for (let i = 0; i < neurons.length; i++) if (neurons[i].word) concepts.set(neurons[i].word, i);
  }
}, 1500);

// ==========================================================================
//  MEMORY POSTER
//  Freezes the current state into a 2400×3000 PNG poster containing:
//   - a rendered snapshot of the mandala
//   - human-readable metrics + top concepts + stream-log excerpts
//   - a visible artistic "memory glyph" (24×24 dot lattice, QR-alternative)
//   - a hidden tEXt chunk in the PNG holding the full JSON payload
//  Any future Claude session (or a decoder script) can read the JSON back
//  from the PNG and reconstruct what this session was about.
// ==========================================================================

function buildMemoryPayload() {
  const streamEntries = Array.from(document.querySelectorAll('.stream-log__entry')).slice(-120).map(e => {
    const kind = [...e.classList].find(c => c.startsWith('stream-log__entry--'))?.replace('stream-log__entry--', '') || 'x';
    return { k: kind, t: e.textContent.slice(0, 500) };
  });
  const concepts = neurons.filter(n => n.word && !n.tool && n.word !== 'user')
    .map(n => ({ w: n.word, e: +n.energy.toFixed(2), h: n.hue | 0 }))
    .sort((a, b) => b.e - a.e).slice(0, 200);
  const tools = neurons.filter(n => n.tool).map(n => n.word).slice(-100);
  return {
    v: 1,
    kind: 'thought-visualizer.memory-poster',
    ts: Date.now(),
    iso: new Date().toISOString(),
    session: { neurons: neurons.length, synapses: synapses.length, glyphs: glyphs.length, tokens: totalTokens },
    concepts, tools, stream: streamEntries,
  };
}

async function generatePoster() {
  const PW = 2400, PH = 3000;
  const c = document.createElement('canvas');
  c.width = PW; c.height = PH;
  const g = c.getContext('2d');

  // background
  const bg = g.createRadialGradient(PW / 2, PH * 0.32, 300, PW / 2, PH * 0.4, PW * 1.1);
  bg.addColorStop(0, '#181038'); bg.addColorStop(0.5, '#0d0820'); bg.addColorStop(1, '#000');
  g.fillStyle = bg; g.fillRect(0, 0, PW, PH);

  // Which concepts dominated this session?  Everything downstream is
  // arranged so a glance at the poster tells you the *topic*.
  const topConcepts = neurons
    .filter(n => n.word && !n.tool && n.word !== 'user' && n.word.length > 2)
    .sort((a, b) => b.energy - a.energy);
  const topFive = topConcepts.slice(0, 5);
  const topTitle = topFive.map(n => n.word).join(' · ') || 'sesja';

  // Header — the title itself is the topic, not a generic label.
  g.textAlign = 'center';
  g.fillStyle = '#e9e2ff';
  g.font = 'italic 300 76px "Fraunces", Georgia, serif';
  wrapText(g, topTitle, PW / 2, 130, PW - 300, 82);
  g.fillStyle = '#b58cff';
  g.font = '500 18px "JetBrains Mono", ui-monospace, monospace';
  g.fillText('claude · opus 4.7 · ' + new Date().toLocaleString('pl-PL'), PW / 2, 220);

  // mandala snapshot
  const snap = { x: 200, y: 280, w: PW - 400, h: 1420 };
  g.save();
  g.beginPath(); g.rect(snap.x, snap.y, snap.w, snap.h); g.clip();
  g.fillStyle = '#07040f'; g.fillRect(snap.x, snap.y, snap.w, snap.h);
  g.drawImage(stage, snap.x, snap.y, snap.w, snap.h);
  g.restore();
  g.strokeStyle = 'rgba(123,77,255,0.25)'; g.lineWidth = 1;
  g.strokeRect(snap.x, snap.y, snap.w, snap.h);

  // Overlay top-3 concepts as huge italic ghosts floating over the mandala.
  // These make the topic recognizable at 3 metres from the printed page.
  const bigPositions = [
    { xf: 0.5,  yf: 0.5,  size: 240 },
    { xf: 0.25, yf: 0.25, size: 150 },
    { xf: 0.75, yf: 0.78, size: 130 },
  ];
  g.textAlign = 'center';
  topFive.slice(0, 3).forEach((n, i) => {
    const p = bigPositions[i];
    g.font = `italic 300 ${p.size}px "Fraunces", Georgia, serif`;
    g.fillStyle = `hsla(${n.hue}, 65%, 78%, 0.24)`;
    g.fillText(n.word, snap.x + snap.w * p.xf, snap.y + snap.h * p.yf);
  });

  // Overlay labels for medium-energy neurons directly on the mandala at
  // their live-screen positions (scaled).  This makes the mesh literally
  // legible — you can *read* the concepts off the network, not just the
  // description below.
  if (lastFrameProjection && lastFrameProjection.length) {
    const sx = snap.w / W, sy = snap.h / H;
    const items = lastFrameProjection.slice().sort((a, b) => {
      const na = neurons[a.idx], nb = neurons[b.idx];
      return (nb?.energy || 0) - (na?.energy || 0);
    }).slice(0, 60);
    for (const it of items) {
      const n = neurons[it.idx];
      if (!n || !n.word) continue;
      const px = snap.x + it.x * sx;
      const py = snap.y + it.y * sy;
      if (px < snap.x + 20 || px > snap.x + snap.w - 20) continue;
      const size = Math.min(34, 14 + n.energy * 10);
      g.font = `500 ${size}px "JetBrains Mono", ui-monospace, monospace`;
      g.textAlign = 'left';
      g.fillStyle = `hsla(${n.hue}, 65%, 82%, ${Math.min(0.95, 0.55 + n.energy * 0.25)})`;
      g.fillText(n.word, px + 8, py + 4);
    }
  }

  const rowY = snap.y + snap.h + 90;

  // metrics column
  g.textAlign = 'left';
  g.fillStyle = '#b58cff';
  g.font = 'italic 300 44px "Fraunces", serif';
  g.fillText('metryka', 200, rowY);
  g.font = '400 22px "JetBrains Mono", monospace';
  g.fillStyle = '#e9e2ff';
  const stats = [
    `neurons  ${String(neurons.length).padStart(4)}`,
    `synapses ${String(synapses.length).padStart(4)}`,
    `glyphs   ${String(glyphs.length).padStart(4)}`,
    `tokens   ${String(totalTokens).padStart(4)}`,
    `stream   ${String(document.querySelectorAll('.stream-log__entry').length).padStart(4)}`,
  ];
  stats.forEach((s, i) => g.fillText(s, 200, rowY + 50 + i * 36));

  // top concepts (with hue colors)
  const conceptsX = 700;
  g.fillStyle = '#b58cff';
  g.font = 'italic 300 44px "Fraunces", serif';
  g.fillText('koncepty', conceptsX, rowY);
  const top = neurons.filter(n => n.word && !n.tool && n.word !== 'user' && n.word.length > 2)
    .sort((a, b) => b.energy - a.energy).slice(0, 40);
  let cx = conceptsX, cy = rowY + 45;
  g.font = '400 22px "JetBrains Mono", monospace';
  for (const n of top) {
    const label = '◆ ' + n.word;
    const w = g.measureText(label).width + 22;
    if (cx + w > PW - 200) { cx = conceptsX; cy += 34; }
    if (cy > rowY + 300) break;
    g.fillStyle = `hsl(${n.hue}, 60%, 68%)`;
    g.fillText(label, cx, cy);
    cx += w + 8;
  }

  // stream section (occupies the rest)
  const streamY = rowY + 380;
  g.fillStyle = '#b58cff';
  g.font = 'italic 300 44px "Fraunces", serif';
  g.fillText('strumień', 200, streamY);
  g.font = '400 15px Menlo, "SF Mono", monospace';
  const entries = Array.from(document.querySelectorAll('.stream-log__entry')).slice(-60);
  let sy = streamY + 42;
  for (const e of entries) {
    const kind = [...e.classList].find(c => c.startsWith('stream-log__entry--'))?.replace('stream-log__entry--', '');
    const color = { thinking: '#a8f0d0', text: '#ffd28c', tool: '#cdb4ff',
                    user: '#ffe08c', result: '#a5a0c2', system: '#9a8fbe' }[kind] || '#9a8fbe';
    g.fillStyle = color;
    const line = e.textContent.replace(/\s+/g, ' ').slice(0, 145);
    g.fillText(line, 200, sy);
    sy += 22;
    if (sy > PH - 340) break;
  }

  // footer — honest about where the machine-readable memory lives
  g.textAlign = 'left';
  g.fillStyle = '#9a8fbe';
  g.font = '400 16px "JetBrains Mono", monospace';
  g.fillText('memory-poster · v1', 200, PH - 90);
  g.fillText('decode: node ~/thought-visualizer/decode.mjs poster.png', 200, PH - 60);
  g.fillText('archive: lucdoro.design/thoughts/', 200, PH - 30);

  // tiny memory-sigil at bottom-right — decorative, not a scannable code
  drawMemorySigil(g, PW - 240, PH - 240, 180);

  // export + inject metadata
  const blob = await new Promise(res => c.toBlob(res, 'image/png'));
  return await injectPngMetadata(blob, buildMemoryPayload());
}

// Simple visual "sigil" — a stack of concentric hexagons.  Purely
// decorative; the real machine-readable data lives in the PNG tEXt chunk.
function drawMemorySigil(g, x, y, size) {
  const cx = x + size / 2, cy = y + size / 2;
  g.save();
  g.translate(cx, cy);
  for (let ring = 0; ring < 6; ring++) {
    const r = size * 0.08 + ring * size * 0.06;
    g.strokeStyle = `hsla(280, 65%, 70%, ${0.15 + ring * 0.09})`;
    g.lineWidth = 1.2;
    g.beginPath();
    for (let k = 0; k <= 6; k++) {
      const a = (k / 6) * Math.PI * 2 + ring * 0.08;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (k === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.stroke();
  }
  g.restore();
  g.textAlign = 'center';
  g.fillStyle = '#6b5b8a';
  g.font = 'italic 300 14px "Fraunces", serif';
  g.fillText('memory sigil', cx, y + size + 22);
}

// Wrap long titles across multiple lines centered on x.
function wrapText(g, text, x, y, maxWidth, lineHeight) {
  const words = String(text).split(/\s+/);
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (g.measureText(test).width > maxWidth && cur) { lines.push(cur); cur = w; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  const totalH = lines.length * lineHeight;
  let ly = y - (lines.length - 1) * lineHeight / 2;
  for (const line of lines) { g.fillText(line, x, ly); ly += lineHeight; }
  return y + totalH / 2;
}

// Inject a tEXt chunk into a PNG blob so the memory JSON travels with the
// image.  Chunk layout: [len(4)] "tEXt" [keyword \0 text] [crc(4)].
async function injectPngMetadata(blob, payload) {
  const src = new Uint8Array(await blob.arrayBuffer());
  const key = 'thought-visualizer';
  const value = JSON.stringify(payload);
  const data = new TextEncoder().encode(key + '\0' + value);
  const chunk = new Uint8Array(4 + 4 + data.length + 4);
  const dv = new DataView(chunk.buffer);
  dv.setUint32(0, data.length, false);
  chunk.set([0x74, 0x45, 0x58, 0x74], 4); // 'tEXt'
  chunk.set(data, 8);
  dv.setUint32(8 + data.length, crc32(chunk.subarray(4, 8 + data.length)), false);
  // Insert after IHDR (signature 8 + IHDR chunk 4+4+13+4 = 25).
  const insertAt = 8 + 4 + 4 + 13 + 4;
  const out = new Uint8Array(src.length + chunk.length);
  out.set(src.subarray(0, insertAt), 0);
  out.set(chunk, insertAt);
  out.set(src.subarray(insertAt), insertAt + chunk.length);
  return new Blob([out], { type: 'image/png' });
}

const _crcTable = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = _crcTable[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

async function savePoster() {
  showCaption('◈ generuję plakat…');
  const blob = await generatePoster();
  const name = `thought-poster-${new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5)}.png`;

  // download
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);

  // also POST to server so a copy is archived + can be published
  try {
    const b64 = await blobToBase64(blob);
    const res = await fetch(OBS_SERVER + '/publish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, png: b64, meta: buildMemoryPayload() }),
    });
    if (res.ok) {
      const j = await res.json();
      showCaption('◈ zapisano lokalnie: ' + j.path);
    }
  } catch (err) {
    showCaption('◈ pobrano lokalnie (serwer niedostępny)');
  }
}
function blobToBase64(blob) {
  return new Promise((resolve) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.readAsDataURL(blob);
  });
}
document.getElementById('poster').addEventListener('click', savePoster);

// autoboot: connect the auto-observer immediately.
setTimeout(() => startObserver(), 300);
</script>
